<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand DNA Strategy Tool</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 15px; font-size: 16px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 15px 30px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { text-align: left; margin-top: 30px; padding: 20px; background: #e9ecef; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Free Brand DNA Strategy Tool</h1>
    <p>Enter your prospect's website URL below to instantly extract their Brand Voice, USPs, and Missing Opportunities.</p>
    
    <input type="text" id="websiteUrl" placeholder="https://www.example.com">
    <button onclick="analyzeBrand()">Analyze Brand Strategy</button>

    <div id="loading" style="display:none; font-weight:bold; color:blue;">Analyzing website... Please wait 5 seconds.</div>
    <div id="result"></div>
</div>

<script>
    async function analyzeBrand() {
        const url = document.getElementById('websiteUrl').value;
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        
        if(!url) { alert("Please enter a URL"); return; }

        resultDiv.innerHTML = "";
        loadingDiv.style.display = "block";

        try {
            // Yahan aapka Vercel API link lagana hai
            const response = await fetch('https://brand-dna-i2d6y68d8-tejas-43bb.vercel.app/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // API key yahan chhupi hui hai client se
                body: JSON.stringify({ url: url, api_key: 'AGENCY-TRIAL-12345' })
            });

            const data = await response.json();

            loadingDiv.style.display = "none";

            if (data.error) {
                resultDiv.innerHTML = `<span style="color:red;">Error: ${data.error}</span>`;
            } else {
                // Data ko sundar format mein dikhana
                const brand = data.brand_dna;
                resultDiv.innerHTML = `
                    <h3>Tone of Voice:</h3> <p>${brand.tone_of_voice}</p>
                    
                    <h3>Unique Selling Propositions (USPs):</h3>
                    <ul>${brand.unique_selling_propositions.map(item => `<li>${item}</li>`).join('')}</ul>
                    
                    <h3>Audience Pain Points:</h3>
                    <ul>${brand.audience_pain_points.map(item => `<li>${item}</li>`).join('')}</ul>
                    
                    <h3>Missing Content Opportunities:</h3>
                    <ul>${brand.missing_content_opportunities.map(item => `<li>${item}</li>`).join('')}</ul>
                    
                    <hr><p style="text-align:right; color:gray;">Tokens Remaining: ${data.tokens_remaining}</p>
                `;
            }
        } catch (error) {
            loadingDiv.style.display = "none";
            resultDiv.innerHTML = `<span style="color:red;">Failed to connect to API. Check your Vercel link.</span>`;
            console.error(error);
        }
    }
</script>

</body>
</html>
